services:
  pz-farm-guide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pz-farm-guide-app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - pz_uploads:/app/public/uploads
    networks:
      - dokploy-network
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_D1_DATABASE_ID=${CLOUDFLARE_D1_DATABASE_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}
      - CLOUDFLARE_R2_PUBLIC_DOMAIN=${CLOUDFLARE_R2_PUBLIC_DOMAIN}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pz-farm-guide.rule=Host(`pzguia.filocentraldemando.site`)"
      - "traefik.http.routers.pz-farm-guide.entrypoints=websecure"
      - "traefik.http.routers.pz-farm-guide.tls.certresolver=letsencrypt"
      - "traefik.http.services.pz-farm-guide.loadbalancer.server.port=3000"

volumes:
  pz_uploads:

networks:
  dokploy-network:
    external: true

